server:
  port: 8080

spring:
  application:
    name: universal-pos
  
  datasource:
    url: jdbc:h2:mem:posdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect

jwt:
  secret: UniversalPOSSecretKey2024VeryLongSecretKeyForJWTTokenGeneration
  expiration: 86400000

logging:
  level:
    com.universalpos: DEBUG
    org.springframework.security: DEBUG